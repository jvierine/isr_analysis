# Only the EPB editor route is proxied; all other juha.no services retain their routes.
ProxyPass /epbrti/ http://127.0.0.1:8736/epbrti/ timeout=120
ProxyPassReverse /epbrti/ http://127.0.0.1:8736/epbrti/
RedirectMatch 302 ^/epbrti$ /epbrti/
<Location /epbrti/>
    Header always set Cache-Control "no-cache"
</Location>
