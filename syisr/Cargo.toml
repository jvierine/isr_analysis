[package]
name = "syisr-ac"
version = "0.1.0"
edition = "2021"
description = "SYISR alternating-code screening, decoded gated ISR analysis and MPI campaign processing"
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
num-complex = { version = "0.4", features = ["serde"] }
errorfunctions = "0.2"
libm = "0.2"
nalgebra = "0.33"
rayon = "1"
rustfft = "6.4"
hdf5 = { package = "hdf5-metno", version = "0.12" }
[workspace]
