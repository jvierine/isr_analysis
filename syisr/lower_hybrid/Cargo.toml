[package]
name = "syisr-lower-hybrid"
version = "0.3.0"
edition = "2021"
[workspace]
[dependencies]
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
rustfft = "6.4"
rayon = "1"
memmap2 = "0.9"
hdf5 = { package = "hdf5-metno", version = "0.12" }
rustplotlib = { git = "https://github.com/jvierine/rustplotlib", rev = "48a31710901dd0ba5f6e0d0ddffc1abde2030f89" }
isr-range-doppler = { path = "../../crates/range-doppler" }
