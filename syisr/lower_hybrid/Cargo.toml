[package]
name = "syisr-lower-hybrid"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
rustfft = "6.4"
rayon = "1"
memmap2 = "0.9"
hdf5 = { package = "hdf5-metno", version = "0.12" }
rustplotlib = { git = "https://github.com/jvierine/rustplotlib", rev = "96e8aaafce8607f8aa506cd59089255a904fc499" }
